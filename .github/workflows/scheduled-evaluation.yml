name: Scheduled Evaluation and Red Teaming

# Scheduled (Preview) evaluation + AI red teaming of the Creative Writer agents.
# Runs the batch quality/safety evaluators and the red-team agent on a cadence and
# on demand. Results upload to the Foundry project and Application Insights.
on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC every day
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  scheduled-evaluation:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_4_EVAL_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_4_EVAL_DEPLOYMENT_NAME }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_EMBEDDING_NAME: ${{ vars.AZURE_EMBEDDING_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
      AI_SEARCH_ENDPOINT: ${{ vars.AI_SEARCH_ENDPOINT }}
      AZURE_OPENAI_NAME: ${{ vars.AZURE_OPENAI_NAME }}
      AZURE_AI_PROJECT_NAME: ${{ vars.AZURE_AI_PROJECT_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      BING_CONNECTION_NAME: ${{ vars.BING_CONNECTION_NAME }}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ vars.APPLICATIONINSIGHTS_CONNECTION_STRING }}

    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r src/api/requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Batch evaluation (quality + safety + task adherence)
        working-directory: ./src/api
        run: python -m evaluate.evaluate

      - name: AI red-teaming scan
        working-directory: ./src/api
        run: python -m evaluate.red_team

      - name: Upload eval results as build artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scheduled_eval_result
          path: ./src/api/evaluate/eval_results.jsonl
